services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - ./backend/db/seeds/01_machines.sql:/docker-entrypoint-initdb.d/01_machines.sql
      - ./backend/db/seeds/02_machine_constraints.sql:/docker-entrypoint-initdb.d/02_machine_constraints.sql
      - ./backend/db/seeds/03_papers.sql:/docker-entrypoint-initdb.d/03_papers.sql
      - ./backend/db/seeds/04_stock_items.sql:/docker-entrypoint-initdb.d/04_stock_items.sql
      - ./backend/db/seeds/05_finishes.sql:/docker-entrypoint-initdb.d/05_finishes.sql
      - ./backend/db/seeds/06_adhesives.sql:/docker-entrypoint-initdb.d/06_adhesives.sql
      - ./backend/db/seeds/07_operations.sql:/docker-entrypoint-initdb.d/07_operations.sql
      - ./backend/db/seeds/08_product_type_routes.sql:/docker-entrypoint-initdb.d/08_product_type_routes.sql
      - ./backend/db/seeds/09_game_components.sql:/docker-entrypoint-initdb.d/09_game_components.sql
      - ./backend/db/seeds/10_cost_rates.sql:/docker-entrypoint-initdb.d/10_cost_rates.sql
      - ./backend/db/seeds/11_users.sql:/docker-entrypoint-initdb.d/11_users.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"

  # ── Streamlit frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      # Override API_BASE_URL to use the internal Docker network hostname
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data:
